name: Code Coverage

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  base-branch:
    runs-on: ubuntu-latest
    outputs:
      code-coverage: ${{ steps.coverage.outputs.result }}
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: 'npm'
      
      - run: npm ci
      - run: npm run test:coverage
      
      - name: Read coverage summary
        id: coverage
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            return require('./coverage/coverage-summary.json')

  head-branch:
    runs-on: ubuntu-latest
    outputs:
      code-coverage: ${{ steps.coverage.outputs.result }}
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
      
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: 'npm'
      
      - run: npm ci
      - run: npm run test:coverage
      
      - name: Read coverage summary
        id: coverage
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            return require('./coverage/coverage-summary.json')

  comment:
    runs-on: ubuntu-latest
    needs: [base-branch, head-branch]
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
      
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: 'npm'
      
      - run: npm ci

      - name: Post coverage comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const script = require('./.github/leave-coverage-comment.cjs')
            await script(github, context, require, ${{ toJSON(needs) }})
