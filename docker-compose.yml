services:
  expo-maze-runner:
    image: 855461928731.dkr.ecr.us-west-1.amazonaws.com/maze-runner-releases:latest-v11-cli
    environment:
      BUILDKITE:
      BUILDKITE_BRANCH:
      BUILDKITE_BUILD_CREATOR:
      BUILDKITE_BUILD_NUMBER:
      BUILDKITE_BUILD_URL:
      BUILDKITE_JOB_ID:
      BUILDKITE_LABEL:
      BUILDKITE_MESSAGE:
      BUILDKITE_PIPELINE_NAME:
      BUILDKITE_PIPELINE_SLUG:
      BUILDKITE_REPO:
      BUILDKITE_RETRY_COUNT:
      BUILDKITE_STEP_KEY:
      BUILDKITE_ANALYTICS_TOKEN:
      MAZE_BUGSNAG_API_KEY:
      MAZE_APPIUM_BUGSNAG_API_KEY:
      MAZE_REPEATER_API_KEY:
      DEBUG:
      BITBAR_USERNAME:
      BITBAR_ACCESS_KEY:
      MAZE_NO_FAIL_FAST:
      EXPO_VERSION:
    ports:
      - "9000-9499:9339"
    networks:
      default:
        aliases:
          - maze-runner
    volumes:
      - ./features:/app/features
      - ./features/maze_output:/app/maze_output
      - /var/run/docker.sock:/var/run/docker.sock

  release:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.release
    environment:
      GITHUB_USER:
      GITHUB_ACCESS_TOKEN:
      NPM_TOKEN:
      RELEASE_BRANCH:
      RETRY_PUBLISH:
      VERSION:
      DIST_TAG:
    volumes:
      - ~/.gitconfig:/home/releaser/.gitconfig
      - ~/.npmrc:/home/releaser/.npmrc

networks:
  default:
    name: ${BUILDKITE_JOB_ID:-core-maze-runner}
